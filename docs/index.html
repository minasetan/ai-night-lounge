<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#231424">
<title>Ai’s Night Lounge</title>
<link rel="icon" href="lounge-mark.png">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;background:#1c1220;color:#f6e4c3}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}
#load{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:1.1rem;padding:2rem;text-align:center;background:radial-gradient(ellipse at 50% 68%,#492842,#201322 62%)}
#load[hidden]{display:none}h1{font:normal clamp(2rem,6vw,4.5rem) Georgia,serif;color:#ecc78e;margin:0}p{font:1rem system-ui,sans-serif;margin:0}progress{width:min(18rem,75vw);height:5px;accent-color:#e5bd7f}
#announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Aiのナイトラウンジ。3Dスロットゲーム"></canvas>
<div id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="load" role="status"><h1>Ai’s Night Lounge</h1><p id="message">ラウンジを開店しています…</p><progress id="progress"></progress></div>
<noscript>プレイするにはJavaScriptを有効にしてください。</noscript>
<script src="index.js"></script>
<script>
const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10368648,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const canvas = document.querySelector("canvas");
const bar = document.querySelector("progress");
const message = document.querySelector("#message");
function showError(error) {
    bar.hidden = true;
    message.textContent = "起動できませんでした。 " + (error.message || error);
}
const missing = Engine.getMissingFeatures({threads: false});
if (missing.length) {
    showError("WebGL 2 と WebAssembly に対応したブラウザで開いてください。");
} else {
    const engine = new Engine(config);
    engine.startGame({canvas, onProgress(done,total) {
        if (total > 0) {bar.max = total; bar.value = done;}
    }}).then(() => {
        document.querySelector("#load").hidden = true;
        canvas.focus({preventScroll:true});
    }).catch(showError);
}
</script>
</body>
</html>
